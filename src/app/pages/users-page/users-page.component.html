<h1>Users Page</h1>

<app-table
  [users]="users"
  (scoreChange)="incrementScore($event)"
  (editUser)="openEditModal($event)"
  >
</app-table>
<app-edit-user-modal
  *ngIf="isModalOpen"
  [user]="selectedUser"
  (saveUser)="saveUser($event)"
  (closeModal)="isModalOpen = false">
</app-edit-user-modal>
