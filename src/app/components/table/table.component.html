<h2>User Table</h2>

<table border="1">

  <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Score</th>
    <th>Actions</th>
  </tr>

  <tr *ngFor="let user of users">
    <td>{{ user.id }}</td>
    <td>

        <a [routerLink]="['/users', user.id]">

            {{ user.name }}

        </a>

    </td>
    <td>{{ user.score }}</td>
    <td>
        <button (click) = incrementScore(user.id)>
            +5
        </button>
        <button (click) = openEditModal(user.id)>Edit</button>
    </td>
  </tr>

</table>
